name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=core --cov=helper --cov=ui

  deb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: packaging/deb/build-deb.sh

      - name: Lint package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          # initial-upload-closes-no-bugs only applies to uploads to the
          # Debian archive, which this package is not.
          lintian --fail-on error,warning \
            --suppress-tags initial-upload-closes-no-bugs \
            packaging/deb/dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/deb/dist/*.deb

  # The app is built against modern libadwaita but falls back to 1.0-era
  # widgets on older stacks (see ui/compat.py). Installing and opening the
  # window on both ends of that range is the only thing that catches a widget
  # that doesn't exist on the older one -- an import test does not.
  deb-install:
    needs: deb-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04 # GTK 4.6, libadwaita 1.1 -- every fallback in use
          - debian:bookworm # GTK 4.8, libadwaita 1.2 -- mixed
          - ubuntu:24.04 # GTK 4.14, libadwaita 1.5 -- all native
          - debian:trixie # GTK 4.18, libadwaita 1.7 -- all native
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: packaging/deb/dist

      - name: Install, open the window and purge
        run: packaging/deb/test-deb.sh packaging/deb/dist/*.deb
